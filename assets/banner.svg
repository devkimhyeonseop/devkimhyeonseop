  </defs>
  <rect width="1500" height="360" fill="url(#bg)"/>
  <rect width="1500" height="360" fill="url(#stripe)"/>
  <rect x="230" y="100" width="1040" height="160" rx="20" fill="#0b1220" opacity="0.92"/>
  <text x="750" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Learn. Build. Document.</text>
