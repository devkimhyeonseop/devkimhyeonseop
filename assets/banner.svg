<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="stripe" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="30" height="60" fill="#0b1220" opacity="0.28"/>
